name: release

# Tag vX.Y.Z -> publish pythia-plsql to PyPI and npm.
# One-time setup (see CONTRIBUTING.md): a PyPI trusted publisher for this
# workflow (no token), and an NPM_TOKEN repository secret for npm.

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the tag is the version; every manifest must already agree with it
      - name: tag matches all version manifests
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -qF "version = \"$V\"" pyproject.toml
          node -e "const a=require('./.claude-plugin/plugin.json').version,
                         b=require('./npm/package.json').version;
                   if (a!=='$V'||b!=='$V') { console.error('plugin.json='+a+' npm='+b+' tag=$V'); process.exit(1) }"
      - run: python -m compileall scripts tests
      - run: python tests/test_phase1.py
      - run: python tests/test_phase2.py
      - run: python tests/test_phase3.py
      - run: python tests/test_phase5.py
      - run: python tests/test_install.py

  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing — no token stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # a duplicate/delayed run must stay green

  npm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # idempotent, and `latest` always points at the HIGHEST version —
      # npm hands `latest` to the most recent publish, so a delayed or
      # re-run backfill of an old tag would otherwise drag users backwards
      - run: |
          V=$(node -p "require('./package.json').version")
          if npm view "pythia-plsql@$V" version >/dev/null 2>&1; then
            echo "npm already has $V — skipping publish"
          else
            npm publish
          fi
          TOP=$(npm view pythia-plsql versions --json | python3 -c "import json,sys; vs=json.load(sys.stdin); vs=[vs] if isinstance(vs,str) else vs; print(sorted(vs, key=lambda v: [int(x) for x in v.split('.')])[-1])")
          CUR=$(npm view pythia-plsql dist-tags.latest)
          if [ "$TOP" != "$CUR" ]; then
            npm dist-tag add "pythia-plsql@$TOP" latest
          fi
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
