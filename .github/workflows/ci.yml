name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # no dependencies to install: the suites run on stdlib alone, by design
      - run: python -m compileall scripts tests
      - run: python tests/test_phase1.py
      - run: python tests/test_phase2.py
      - run: python tests/test_phase3.py
      - run: python tests/test_phase5.py
