name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # no dependencies to install: the suites run on stdlib alone, by design
      - run: python -m compileall scripts tests
      - run: python tests/test_phase1.py
      - run: python tests/test_phase2.py
      - run: python tests/test_phase3.py
      - run: python tests/test_phase5.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --check npm/bin.js
      - run: pip wheel . --no-deps -w dist
      - run: pip install --no-deps dist/*.whl
      # the entry point must run outside the repo layout, with queries and
      # skills resolving from the wheel's package data
      - run: cd /tmp && pythia --help && pythia policy
      - run: cd /tmp && python -c "import pythia; assert (pythia.QUERY_DIR / 'impact.sql').is_file(); assert (pythia.SKILLS_DIR / 'plsql-apply' / 'SKILL.md').is_file()"
      # the no-Node whole-kit fallback: scaffold + bundled skill copies
      # (absolute interpreter + empty PATH so npx is genuinely invisible)
      - run: |
          PY=$(which python)
          mkdir /tmp/kit && cd /tmp/kit
          PATH=/nonexistent "$PY" -m pythia install
          test -f .claude/skills/plsql-apply/SKILL.md
          test -f .agents/skills/plsql-review/reference/antipatterns.md
          test -f .pythia/connections.json
