name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # no dependencies to install: the suites run on stdlib alone, by design
      - run: python -m compileall scripts tests
      - run: python tests/test_phase1.py
      - run: python tests/test_phase2.py
      - run: python tests/test_phase3.py
      - run: python tests/test_phase5.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: node --check npm/bin.js
      - run: pip wheel . --no-deps -w dist
      - run: pip install --no-deps dist/*.whl
      # ...and then actually run it. `node --check` is a syntax check; the
      # npm path is the one most Windows users take, and the one that dodges
      # the PATH problem by calling `python -m pythia`. Its pip step finds the
      # locally built wheel already installed and newer than the published
      # one, so this exercises the wrapper against this commit.
      - run: |
          mkdir /tmp/npmkit && cd /tmp/npmkit
          node $GITHUB_WORKSPACE/npm/bin.js
          test -f .pythia/connections.json
      # the entry point must run outside the repo layout, with queries and
      # skills resolving from the wheel's package data
      - run: cd /tmp && pythia --help && pythia policy
      - run: cd /tmp && python -c "import pythia; assert (pythia.QUERY_DIR / 'impact.sql').is_file(); assert (pythia.SKILLS_DIR / 'pythia-apply' / 'SKILL.md').is_file()"
      # the no-Node whole-kit fallback: scaffold + bundled skill copies
      # (absolute interpreter + empty PATH so npx is genuinely invisible)
      - run: |
          PY=$(which python)
          mkdir /tmp/kit && cd /tmp/kit
          PATH=/nonexistent "$PY" -m pythia install
          test -f .claude/skills/pythia-apply/SKILL.md
          test ! -e .agents/skills/pythia-apply
          test -f .claude/skills/pythia-review/reference/antipatterns.md
          test -f .pythia/connections.json

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m compileall bench
      - run: python bench/bench.py --selftest
      # regression gate: reliability must stay 100, other axes may not drop
      - run: python bench/bench.py --check

  # after a version bump lands on main, re-score and commit the scoreboard —
  # one row per release, so BENCHMARK.md updates itself on every upgrade.
  # --if-new-version makes the bot commit a no-op on every other push (and on
  # its own push), so this cannot loop.
  bench-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: bench
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python bench/bench.py --if-new-version
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add BENCHMARK.md bench/results/history.jsonl
            git commit -m "bench: scoreboard for $(grep -oP '(?<=^version = ")[^"]+' pyproject.toml)"
            git push
          fi
